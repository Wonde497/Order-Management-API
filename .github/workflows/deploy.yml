name: Build and Generate Migration

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest

    env:
      # Inject connection string so DbContext initialization doesn't crash during build/tool execution
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
      Jwt__Key: ${{ secrets.JWT_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install EF Core CLI Tool
      run: dotnet tool install --global dotnet-ef

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Generate Idempotent Migration Script
      run: dotnet ef migrations script --output update.sql --idempotent --project OrderManagementAPI.csproj