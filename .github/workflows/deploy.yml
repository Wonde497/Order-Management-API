name: Build, Migrate, and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Install EF Core CLI Tool
      run: dotnet tool install --global dotnet-ef

    - name: Generate Idempotent Migration Script
      run: dotnet ef migrations script --output update.sql --idempotent --project OrderManagementAPI.csproj

    # Optional: Apply update.sql to production DB or trigger host deployment here